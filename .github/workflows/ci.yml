name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  corpus:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # No pip install step on purpose — the engine has no dependencies,
      # including its MIDI parser. If this ever needs one, that is a decision
      # to argue for, not to slip in.
      - name: Run corpus regressions
        run: python3 prototype/test_corpus.py

  fixtures-reproducible:
    # A fixture generator that no longer reproduces its own fixture is a
    # corpus that silently stopped meaning anything.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Regenerate every fixture and diff
        run: |
          for m in corpus/*/make.py; do
            echo "regenerating $m"
            python3 "$m"
          done
          git diff --exit-code -- corpus/ \
            || { echo "::error::A fixture generator no longer reproduces its committed output."; exit 1; }

  mac-app:
    # the Mac app people actually run (app/), built the way build.sh
    # builds it; the August Swift app in gui/ was retired 2026-09-29
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Copyist.app
        run: app/build.sh

  windows-door:
    # the Windows door is PowerShell: check it parses on real Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse windows/CopyistApp.ps1
        shell: pwsh
        run: |
          $e = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD/windows/CopyistApp.ps1", [ref]$null, [ref]$e) | Out-Null
          if ($e.Count) { $e | ForEach-Object { $_.ToString() }; exit 1 }
          "parses clean"
      - name: Inno Setup, for the installer
        shell: pwsh
        run: if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Build Copyist-Setup.exe
        shell: pwsh
        run: windows/build-installer.ps1
      - name: Install quietly, self-test the installed copy, uninstall
        shell: pwsh
        run: |
          $p = Start-Process app\build\Copyist-Setup.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CURRENTUSER' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installer exit $($p.ExitCode)" }
          $app = "$env:LOCALAPPDATA\Programs\Copyist"
          if (-not (Test-Path "$app\windows\CopyistApp.ps1")) { throw "not installed where expected" }
          if (-not (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Copyist.lnk")) { throw "no Start menu entry" }
          # Windows PowerShell 5.1, what the Start menu entry runs
          powershell -NoProfile -ExecutionPolicy Bypass -File "$app\windows\CopyistApp.ps1" -SelfTest
          if ($LASTEXITCODE -ne 0) { throw "installed self-test failed" }
          $u = Get-ChildItem "$app\unins*.exe" | Select-Object -First 1
          $p = Start-Process $u.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          Start-Sleep -Seconds 3
          if (Test-Path "$app\windows\CopyistApp.ps1") { throw "uninstall left the app behind" }
          "Installed, self-tested and uninstalled cleanly."
